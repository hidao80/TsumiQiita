<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- TsumiQiita: 積み重ねた原稿（積みQiita）を表すアイコン -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82d6"/>
      <stop offset="1" stop-color="#2459a8"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <!-- 奥の原稿 -->
  <rect x="300" y="210" width="440" height="520" rx="36" fill="#ffffff" opacity="0.45" transform="rotate(-8 520 470)"/>
  <rect x="290" y="240" width="440" height="520" rx="36" fill="#ffffff" opacity="0.7" transform="rotate(-3 510 500)"/>
  <!-- 手前の原稿 -->
  <rect x="284" y="280" width="440" height="520" rx="36" fill="#ffffff"/>
  <!-- 見出しと本文の行 -->
  <rect x="344" y="350" width="220" height="40" rx="20" fill="#2459a8"/>
  <rect x="344" y="440" width="320" height="28" rx="14" fill="#9fb8dc"/>
  <rect x="344" y="500" width="320" height="28" rx="14" fill="#9fb8dc"/>
  <rect x="344" y="560" width="260" height="28" rx="14" fill="#9fb8dc"/>
  <rect x="344" y="620" width="300" height="28" rx="14" fill="#9fb8dc"/>
  <rect x="344" y="680" width="180" height="28" rx="14" fill="#9fb8dc"/>
