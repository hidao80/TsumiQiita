version: 2
updates:
  # 公開から7日未満の版は提案しない（src/bunfig.toml の minimumReleaseAge と揃える。
  # 揃えないと bun が新しすぎる版を拒否し、Dependabot の更新が失敗する）
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "bun"
    directory: "/src"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "cargo"
    directory: "/src/src-tauri"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
