name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

# 同じPRへの新しいpushが来たら、古い実行は取り消す。master へのpushはコミットごとに別グループにし、取り消さずに結果を残す
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    # Tauriは実行OS向けのインストーラーを作るため、OSごとにビルドする
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        # package.json のルートは src/
        working-directory: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: flatt-security/setup-takumi-guard-npm@14f07d0cbc739b42a1b7c70a04c2b84cd1318ddd # v1.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src/src-tauri
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: bun install --frozen-lockfile
      # Viteでレンダラーをビルドし、Tauriでパッケージングする（証明書が無いためコード署名はしない）
      - run: bun run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TsumiQiita-${{ matrix.os }}
          # upload-artifact のパスは working-directory ではなくリポジトリ直下が基準
          path: |
            src/src-tauri/target/release/bundle/msi/*.msi
            src/src-tauri/target/release/bundle/nsis/*.exe
            src/src-tauri/target/release/bundle/dmg/*.dmg
            src/src-tauri/target/release/bundle/deb/*.deb
            src/src-tauri/target/release/bundle/rpm/*.rpm
            src/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
